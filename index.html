<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — Painéis Planejar</title>

  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="estilo.css?v=2">
</head>
<body>

  <main class="login-tela">
    <div class="login-caixa">

      <div class="marca">
        <img src="logoplanejar.png" alt="Planejar Engenharia">
      </div>

      <form class="cartao" id="formLogin" autocomplete="on">
        <h1>Acesso aos painéis</h1>
        <p class="sub">Entre com suas credenciais para visualizar os relatórios liberados para você.</p>

        <div class="campo">
          <label for="usuario">Usuário</label>
          <div class="entrada">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
            </svg>
            <input type="text" id="usuario" name="usuario" placeholder="nome.sobrenome"
                   autocomplete="username" autocapitalize="none" spellcheck="false" required>
          </div>
        </div>

        <div class="campo">
          <label for="senha">Senha</label>
          <div class="entrada">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input type="password" id="senha" name="senha" placeholder="6 primeiros dígitos do CPF"
                   autocomplete="current-password" inputmode="numeric" required>
          </div>
        </div>

        <button type="submit" class="btn-entrar">Entrar</button>

        <div class="aviso-erro" id="avisoErro" role="alert" aria-live="polite">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/>
          </svg>
          <span id="textoErro">Usuário ou senha incorretos.</span>
        </div>
      </form>

      <p class="rodape-login">
        Problemas de acesso? Fale com a equipe de TI.<br>
        Planejar Engenharia
      </p>

    </div>
  </main>

  <!-- Ao atualizar a lista de usuários, aumente o número do ?v= abaixo
       para que os navegadores baixem a versão nova em vez do cache. -->
  <script src="usuarios.js?v=2"></script>
  <script src="login.js?v=2"></script>
</body>
</html>
